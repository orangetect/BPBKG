name: Auto Update Worker

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🧱 初始化仓库
        uses: actions/checkout@v4

      - name: 🧾 获取当前本地版本
        run: |
          echo "::group::获取本地版本"
          LOCAL_VERSION=""
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(<version.txt)
            echo "当前本地版本: $LOCAL_VERSION"
          else
            echo "首次运行，无本地版本"
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: 🌐 获取最新 Release 信息
        run: |
          echo "::group::获取最新 Release"
          API_URL="https://api.github.com/repos/bia-pain-bache/BPB-Worker-Panel/releases/latest"
          RESPONSE=$(curl -s "$API_URL")
          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name == "worker.zip") | .browser_download_url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "❌ 未找到 worker.zip，退出！"
            exit 1
          fi

          echo "最新版本号: $TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: 🔍 判断是否需要更新
        run: |
          echo "::group::检查更新需求"
          if [ "$LOCAL_VERSION" = "$TAG_NAME" ]; then
            echo "✅ 已是最新版本"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "📦 有新版本，准备更新"
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi
          echo "::endgroup::"

      - name: 🔄 清理旧文件并更新
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "::group::更新文件内容"
          set -e
          echo "🧹 清理旧文件（保留 .git 和 .github）"
          find . -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.' -exec rm -rf {} +

          echo "⬇️ 下载 worker.zip"
          wget -O worker.zip "$DOWNLOAD_URL"

          echo "📂 解压 worker.zip"
          unzip -o worker.zip

          echo "🗑️ 删除压缩包"
          rm worker.zip

          echo "📝 写入新版本号"
          echo "$TAG_NAME" > version.txt
          echo "::endgroup::"

      - name: 🚀 提交并推送更新
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动同步最新 Worker 版本：${{ env.TAG_NAME }}"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          # push_options: --force  # ⚠️ 如无必要，请避免强推
      - name: 📢 Telegram 通知更新
        if: env.UPDATE_NEEDED == 'true'
        run: |
          MESSAGE="🔔 Worker 已更新为版本：${{ env.TAG_NAME }}%0A📅 更新时间：$(date '+%Y-%m-%d %H:%M:%S')"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
