name: Build and Obfuscate BPB Panel

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖项
        run: |
          npm install -g javascript-obfuscator

      - name: 下载 BPB worker.js
        run: |
          wget -O origin.js https://raw.githubusercontent.com/bia-pain-bache/BPB-Worker-Panel/main/build/unobfuscated-worker.js

      - name: 混淆 BPB worker.js
        run: |
          javascript-obfuscator origin.js --output _worker.js \
            --compact true \
            --control-flow-flattening false \
            --dead-code-injection false \
            --identifier-names-generator mangled \
            --rename-globals false \
            --string-array true \
            --string-array-encoding 'rc4' \
            --string-array-threshold 0.75 \
            --transform-object-keys true \
            --unicode-escape-sequence true

      - name: 生成 Changelog
        run: |
          echo "# 更新日志" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## ${{ env.VERSION }}" >> CHANGELOG.md
          echo "- 自动发布的新版本" >> CHANGELOG.md
          echo "- 更新时间：$(date '+%Y-%m-%d %H:%M')" >> CHANGELOG.md

      - name: 提交更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: ':arrow_up: 更新最新的 BPB 面板并更新 Changelog'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          file_pattern: '_worker.js CHANGELOG.md'

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: |
            🚀 自动发布的新版本！
            - 时间: ${{ env.VERSION }}
            - 文件: _worker.js
          files: |
            _worker.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 部署到 Cloudflare Worker
        run: |
          wrangler login --api-token ${{ secrets.CF_API_TOKEN }}
          wrangler publish --name ${{ secrets.CF_WORKER_NAME }} --env production
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
